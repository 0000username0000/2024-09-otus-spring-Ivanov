server:
  port: 8081  # Запуск на порту 8081

spring:
  application:
    name: security-service
  datasource:
    url: jdbc:h2:mem:security-db
    driver-class-name: org.h2.Driver
    username: root
    password: root
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:changeLog/master.xml
    enabled: true

